# Fly.io config for the Nexa POC.
app = "nexa-asean-poc"
primary_region = "sin"

[build]

[env]
  NEXA_DB = "/data/nexa.db"

# SQLite database (and room for stored assets) on a persistent volume.
# A volume belongs to one machine, so the app runs as a single machine.
[mounts]
  source = "nexa_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Scale to zero when idle; the first request wakes the machine (a few seconds).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/events"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
